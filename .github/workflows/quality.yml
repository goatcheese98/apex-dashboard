name: Workspace quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Audit full dependency graph
        run: npm audit --audit-level=low
      - name: Audit runtime dependency graph
        run: npm audit --omit=dev --audit-level=low
      - name: Check local MCP dependency compatibility
        run: npm run test:dependencies
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:lint-discovery
      - run: npm run test -- --run --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Cloud browser verification
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 > /tmp/apex-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
